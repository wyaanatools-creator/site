<div dir="{{ dir }}" style="position:relative;min-height:100vh;isolation:isolate;overflow-x:clip">
  <div style="position:fixed;inset:-6%;z-index:-2;background:#f1eeed url('./assets/fabric.png') center/cover no-repeat;filter:brightness(1.12) contrast(.92)"></div>
  <div style="position:fixed;inset:0;z-index:-2;pointer-events:none;background:rgba(255,255,255,.22)"></div>
  <div style="position:fixed;inset:-12%;z-index:-1;pointer-events:none;mix-blend-mode:multiply;opacity:.3"><img src="./assets/palm-shadow-2.png" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:left top;display:block;filter:blur(2px)"></div>

  <header style="position:fixed;top:16px;left:50%;transform:translateX(-50%);width:max-content;max-width:min(92vw,360px);z-index:50;display:flex;align-items:center;gap:16px;padding:10px 12px 10px 22px;border-radius:28px;background:rgba(241,238,237,.45);backdrop-filter:blur(22px) saturate(1.3);-webkit-backdrop-filter:blur(22px) saturate(1.3);box-shadow:0 10px 40px rgba(36,27,23,.08)">
    <a href="./Wyaana Landing.dc.html" style="display:flex;align-items:center"><img src="./assets/logo-dark.png" alt="Wyaana" style="height:30px;width:auto;display:block"></a>
    <div style="display:flex;align-items:center;gap:6px">
      <button onClick="{{ toggleLang }}" style="appearance:none;border:none;background:rgba(36,27,23,.08);color:#241b17;border-radius:999px;padding:0 12px;font:inherit;font-size:13px;cursor:pointer;min-height:36px" style-hover="background:#241b17;color:#f1eeed">{{ t.langBtn }}</button>
      <a href="./Wyaana Landing.dc.html" style="display:inline-flex;align-items:center;background:rgba(36,27,23,.08);border-radius:999px;padding:0 14px;font-size:13px;min-height:36px" style-hover="background:#241b17;color:#f1eeed">{{ t.back }}</a>
    </div>
  </header>

  <article data-screen-label="Story" style="max-width:760px;margin:0 auto;padding:160px clamp(20px,6vw,80px) 120px;display:flex;flex-direction:column;gap:28px">
    <span style="font-size:13px;letter-spacing:.3em;text-transform:uppercase;color:#6e625c">{{ t.label }}</span>
    <h1 style="margin:0;font-family:'The Year of the Camel','Wyaana Arabic','IBM Plex Sans Arabic','Instrument Sans',sans-serif;font-weight:600;font-size:clamp(34px,5vw,64px);line-height:1.3;text-wrap:balance">{{ t.title }}</h1>
    <div style="display:flex;align-items:center;justify-content:center;padding:clamp(8px,2vw,24px) 0"><img src="./assets/story-dallah-pencil.png" alt="Dallah and finyals" style="width:100%;max-width:420px;height:auto;display:block;opacity:.9"></div>
    <p style="margin:0;font-size:clamp(18px,1.7vw,22px);line-height:1.6;color:#6e625c;text-wrap:pretty">{{ t.subtitle }}</p>
    <sc-for list="{{ t.sections }}" as="s" hint-placeholder-count="3">
      <section style="display:flex;flex-direction:column;gap:18px;margin-top:10px">
        <sc-if value="{{ s.hasHeading }}" hint-placeholder-val="{{ false }}">
          <h2 style="margin:18px 0 0;font-family:'The Year of the Camel','Wyaana Arabic','IBM Plex Sans Arabic','Instrument Sans',sans-serif;font-weight:600;font-size:clamp(24px,2.8vw,36px);line-height:1.32;text-wrap:balance">{{ s.heading }}</h2>
        </sc-if>
        <sc-for list="{{ s.paragraphs }}" as="p" hint-placeholder-count="2">
          <p style="margin:0;font-size:clamp(17px,1.5vw,20px);line-height:1.8;text-wrap:pretty">{{ p }}</p>
        </sc-for>
        <sc-if value="{{ s.hasManifesto }}" hint-placeholder-val="{{ false }}">
          <div style="display:flex;flex-direction:column;gap:10px;padding:28px 0;border-top:1px solid rgba(36,27,23,.15);border-bottom:1px solid rgba(36,27,23,.15);margin:8px 0">
            <span style="font-family:'The Year of the Camel','Wyaana Arabic','IBM Plex Sans Arabic','Instrument Sans',sans-serif;font-weight:700;font-size:clamp(26px,3.4vw,44px);letter-spacing:.16em;text-transform:uppercase;margin-bottom:8px">{{ s.manifestoTitle }}</span>
            <sc-for list="{{ s.manifesto }}" as="m" hint-placeholder-count="3">
              <span style="font-size:clamp(17px,1.6vw,21px);line-height:1.5">{{ m }}</span>
            </sc-for>
          </div>
        </sc-if>
      </section>
    </sc-for>
    <sc-if value="{{ t.hasPlaceholder }}" hint-placeholder-val="{{ false }}">
      <div style="margin-top:12px;padding:22px 24px;border:1px dashed rgba(36,27,23,.3);border-radius:8px;font-family:ui-monospace,Menlo,monospace;font-size:13px;line-height:1.6;color:#6e625c">{{ t.placeholder }}</div>
    </sc-if>
    <p style="margin:24px 0 0;font-family:'The Year of the Camel','Wyaana Arabic','IBM Plex Sans Arabic','Instrument Sans',sans-serif;font-weight:600;font-size:clamp(20px,2.4vw,30px);letter-spacing:.14em;text-transform:uppercase">{{ t.sign }}</p>
  </article>

  <footer style="padding:32px clamp(20px,6vw,80px) 40px;border-top:1px solid rgba(36,27,23,.12)">
    <div style="max-width:1240px;margin:0 auto;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:16px;font-size:13px;color:#6e625c">
      <div style="display:flex;align-items:center;gap:14px"><img src="./assets/logo-dark.png" alt="Wyaana" style="height:34px;width:auto;display:block"><span style="font-family:'The Year of the Camel','Wyaana Arabic','IBM Plex Sans Arabic','Instrument Sans',sans-serif;font-size:16px;color:#241b17">خلّيها إماراتية</span></div>
      <span>{{ t.made }}</span>
      <span>© 2026 Wyaana</span>
    </div>
  </footer>
</div>

<script type="text/x-dc" data-dc-script data-props="{&quot;defaultLang&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;en&quot;,&quot;options&quot;:[&quot;en&quot;,&quot;ar&quot;],&quot;tsType&quot;:&quot;'en' | 'ar'&quot;,&quot;section&quot;:&quot;Language&quot;}}">
class Component extends DCLogic {
  state = { lang: null };
  copy() {
    const S = (heading, paragraphs, extra = {}) => ({ heading, hasHeading: !!heading, paragraphs, hasManifesto: !!extra.manifesto, manifestoTitle: extra.manifestoTitle, manifesto: extra.manifesto || [] });
    return {
      en: {
        langBtn: 'عربي', back: 'Home', label: 'The Story', made: 'Produced in the United Arab Emirates', sign: 'Keep it Emarati',
        title: 'The Story of Wyaana',
        subtitle: 'A taste of home, carried into the world.',
        hasPlaceholder: false, placeholder: '',
        sections: [
          S('', [
            'There was a bag of Gahwa moving through Europe inside our founder’s luggage. It travelled through Paris, Milan and London, cities where coffee had its own rituals, its own language and its own devoted following. His work in film, advertising and the creative industries carried him between productions, meetings and hotel rooms, and the bag travelled with him because it held something none of those cities could give him: the taste of home.',
            'Whenever he opened it, the room changed. The aroma of the roast rose first, followed by the brightness of cardamom and the warmth of saffron. Water met Gahwa, steam gathered and dates waited nearby. For a few quiet minutes, an unfamiliar hotel room felt closer to an Emarati home.',
            'Back in the UAE, he bought the Gahwa he loved from an Emarati woman in Ajman. Her distinctive preparation became a familiar part of his travels, carrying the kind of knowledge often passed quietly through Emarati homes rather than written on a label. Whenever he travelled, he carried enough with him for the journey ahead.',
            'The difficulty began once he was away. Gahwa asks for time, attention and the right tools. A traveller does not always have a Dallah, the right heat or a kitchen in which to prepare it properly. Sometimes there was only a kettle, a hotel desk and whatever equipment the city could offer. And so, the bag became an experiment.'
          ]),
          S('The Hotel Room Experiments', [
            'Late in the evening, after the meetings were over, he would begin again. What actually makes Gahwa taste like Gahwa? Is it the origin of the bean, the depth of the roast or the size of the grind? How long should it rest in the water? How much cardamom is enough before it begins to dominate? When should saffron enter? What changes when the weather is cold, the water is different or the equipment is unfamiliar?',
            'He tested one element at a time. He changed the origin, roasted lighter and darker, ground finer and coarser, adjusted the spices and observed the brewing time. During cold European winters, ginger occasionally entered the experiment, adding warmth without replacing the character he was trying to protect.',
            'Some attempts were thin. Others were bitter, heavy with spice or fragrant but empty on the palate. The failures taught him something important: Gahwa could not travel consistently through instinct alone. Its soul lived in the relationship between origin, roast, grind, spice and method, and every decision had to support the others.',
            'Then he looked at a French press and asked a question that sounded almost wrong: could this make Gahwa? The purpose was never to turn Gahwa into something foreign. It was to understand whether a contemporary tool, available almost anywhere, could carry the same aroma, warmth and generosity. He continued testing until the result felt familiar.',
            'What began as necessity became a personal ritual: Gahwa, dates and a familiar aroma in a distant room. Wherever he was, home moved a little closer.'
          ]),
          S('When a Private Ritual Became an Idea', [
            'Friends and colleagues began tasting what he was preparing. At first, they approached it with curiosity. Then an espresso drinker asked for another Finyal. Someone accustomed to beginning the morning with an Americano returned the next day and asked whether there was more Gahwa.',
            'That was the moment the bag inside the suitcase stopped being a private comfort and started becoming an idea. The people around him did not need Gahwa to be disguised as something they already understood. They only needed to encounter it properly: its aroma, its hospitality, the rhythm of pouring and receiving, and the story held inside it.',
            'Perhaps Gahwa did not need to be changed for the world. Perhaps it simply needed the stage it deserved.'
          ]),
          S('Let the World Learn Our Words', [
            'He returned to the UAE in 2016, but the question stayed with him. Years later, a visit to Japan gave it sharper form. In Japan, he found himself learning Japanese words simply by moving through the culture. The names of dishes, ingredients, objects and rituals remained Japanese. Visitors were expected to learn them because the language itself was part of the experience.',
            'He began to question why Gahwa becomes “Arabic coffee” the moment it meets a foreigner. Why does a Dallah become an “Arabic coffee pot”? Why does a Finyal become an “Arabic coffee cup”?',
            'Every translation is a small subtraction. These words were never only names. They carry the ritual, the memory and the distinct hospitality of a particular place. That conviction became the philosophy at the heart of what he was building:'
          ], { manifestoTitle: 'Keep it Emarati', manifesto: ['It is Gahwa. Not Arabic coffee.', 'It is a Dallah. Not an Arabic coffee pot.', 'It is a Finyal. Not an Arabic coffee cup.', 'When we enter another culture, we learn its words. So let the world learn ours.'] }),
          S('From Experimentation to a Platform', [
            'His curiosity grew into years of practical research encompassing sourcing, roasting, grinding, production, brewing, packaging, serving rituals, contemporary preparation methods and the relationship between younger generations and their heritage.',
            'Through his earlier venture, Al Dallah w Al Finyal, he explored how Emarati Gahwa could be prepared and presented in contemporary ways without losing its character. The work did not follow a straight line. Recipes that succeeded in one setting did not always remain consistent in another. A beautiful presentation meant little if the Gahwa itself lost its balance, and a contemporary method was only valuable if it served the taste, identity and ritual. Those lessons clarified the standard: innovation had to protect identity, not perform over it.',
            'The most important learning, however, did not come from equipment. It came from people. Before Gahwa becomes a product, it is knowledge, and that knowledge begins in Emarati homes. Every family may have its own roast, its own balance of cardamom and saffron, its own method and its own quiet secret. He wanted this knowledge to hold a real place in the business he was building.',
            'During the Al Dallah w Al Finyal journey, he collaborated with an Emarati mother from Fujairah who brought deep knowledge and experience in traditional Gahwa preparation. She joined the journey as an R&D expert, contributing directly to the development and testing of recipes, flavours and preparation methods.',
            'That was precisely the point. He was an entrepreneur building a contemporary Gahwa business, but he understood that some of its most valuable knowledge could not be found in a conventional business manual. It lived with the elders who had prepared, served and understood Gahwa throughout their lives.',
            'The collaboration brought an entrepreneur and an elder together within an actual commercial business. Her knowledge was not treated merely as inspiration or used as an image in a campaign. It played a meaningful role in shaping a real product and developing a contemporary Gahwa business.',
            'For Eid, their work was celebrated through a dedicated seasonal Gahwa release. The release mattered for more than its flavour. It demonstrated how inherited knowledge could participate directly in contemporary business while being preserved and passed forward to a new generation.',
            'At the time, this kind of collaboration was still unusual in the area. Today, bringing elders into the development of culturally rooted products has become a growing movement. This was the larger possibility he had begun to see: a brand could become more than a producer; it could become a platform for people.',
            'Young Emaratis were invited to experiment with Gahwa and imagine what the tradition could mean to their generation. Experienced members of the community tasted, advised and passed on what they knew, while younger participants contributed new ideas. Tradition became a conversation rather than a museum piece. Gahwa was no longer simply something young people inherited; it became something they could contribute to.'
          ]),
          S('The Name That Was Already There', [
            'The name Wyaana arrived almost by coincidence. The founder was speaking with Fatima Bint Salem, an Emarati artist and creative from Abu Dhabi, telling her about what he wanted to build. Through her work at Al Ghadeer, Fatima brings elders into the development of contemporary products that remain rooted in Emarati culture and can be presented to the world. She immediately understood the idea he was trying to describe.',
            'He explained that the platform should bring our mothers with us, our elders with us, young Emaratis with us, artists with us and everyone who had something meaningful to contribute with us. As he described the idea, he repeated the word “Wyaana” nearly ten times.',
            'Fatima stopped him and said, “There you go. The name is already in your mouth.”',
            'Wyaana. With us.',
            'The name had not been created through a branding exercise. It emerged naturally from the philosophy itself, because culture is not the work of one person. Wyaana is the entrepreneur with the elder, the inherited recipe with the new idea, the artist with the storyteller, and the knowledge of our homes with the ambition to carry it into the world.',
            'That is why the name could only be Wyaana.'
          ]),
          S('Wyaana', [
            'At the heart of Wyaana are the founder’s house recipes and the knowledge gathered through years of testing how Gahwa can be brewed, served and enjoyed consistently while remaining true to its character. Around that foundation, the doors remain open.',
            'An Emarati mother may bring decades of knowledge, while a young Emarati may bring an unexpected idea. An artist may see the UAE through a different lens, and a designer may reinterpret a familiar object. A farmer, chef or storyteller may add another layer to the culture surrounding Gahwa. Some collaborations may become seasonal Gahwa editions, while others may become art, design, objects, workshops or cultural experiences.',
            'Wyaana provides the house. People bring new stories through its doors.',
            'Keeping it Emarati does not mean keeping it in the past. Living traditions move. They evolve between generations and travel beyond borders. A Dallah can belong within contemporary design. A Finyal can sit confidently on the table of a five-star hotel. Gahwa can be prepared through a contemporary method, provided its character remains unmistakably its own.',
            'The world does not need a translation that strips away that identity. It can learn the names: Gahwa, Dallah and Finyal.',
            'That is the meaning of KEEP IT EMARATI. It is not about closing our culture to the world. It is about opening it to the world without diluting what makes it ours.'
          ]),
          S('A Story Begins', [
            'Somewhere in the United Arab Emirates, a Dallah is being lifted and a Finyal is being offered, perhaps to someone encountering Gahwa for the first time.',
            'Gahwa is poured, one person welcomes another, and a story begins.'
          ])
        ]
      },
      ar: {
        langBtn: 'EN', back: 'الرئيسية', label: 'القصة', made: 'أُنتج في الإمارات العربية المتحدة', sign: 'خلّيها إماراتية',
        title: 'قصة ويّانا',
        subtitle: 'طعم البيت، محمولًا إلى العالم.',
        hasPlaceholder: false, placeholder: '',
        sections: [
          S('', [
            'كان هناك كيس قهوة يتنقّل في أوروبا داخل حقيبة مؤسّسنا. سافر معه إلى باريس وميلانو ولندن؛ مدنٌ للقهوة فيها طقوسها ولغتها وعشّاقها. كان عمله في السينما والإعلان والصناعات الإبداعية ينقله بين مواقع التصوير والاجتماعات وغرف الفنادق، وكان الكيس يرافقه لأنه يحمل ما لا تستطيع أيٌّ من تلك المدن أن تمنحه إياه: طعم البيت.',
            'كلّما فتحه، تغيّرت الغرفة. يصعد عبير التحميص أولًا، ثم سطوع الهيل ودفء الزعفران. يلتقي الماء بالقهوة، ويتجمّع البخار، وينتظر التمر قريبًا. ولدقائق هادئة، تصير غرفة فندق غريبة أقرب إلى بيت إماراتي.',
            'في الإمارات، كان يشتري القهوة التي يحبّها من سيّدة إماراتية في عجمان. صارت طريقتها المميّزة في التحضير جزءًا مألوفًا من أسفاره، تحمل ذلك النوع من المعرفة الذي يُتوارث بهدوء في البيوت الإماراتية ولا يُكتب على ملصق. وكلّما سافر، حمل معه ما يكفي للرحلة.',
            'بدأت الصعوبة حين ابتعد. فالقهوة تطلب وقتًا وانتباهًا والأدوات الصحيحة. والمسافر لا يملك دائمًا دلّة، ولا الحرارة المناسبة، ولا مطبخًا يحضّرها فيه كما ينبغي. أحيانًا لم يكن هناك سوى غلّاية، ومكتب فندق، وما تجود به المدينة من أدوات. وهكذا، صار الكيس تجربة.'
          ]),
          S('تجارب غرف الفنادق', [

  speak(lang) {
    const synth = typeof window !== 'undefined' && window.speechSynthesis; if (!synth || typeof SpeechSynthesisUtterance === 'undefined') return;
    if (synth.speaking || this.state.speaking) { synth.cancel(); this.setState({ speaking: false }); return; }
    const root = document.querySelector('[dir]'); if (!root) return;
    const c = root.cloneNode(true);
    c.querySelectorAll('header,footer,button,a,script,style,svg,img').forEach(n => n.remove());
    const u = new SpeechSynthesisUtterance(c.innerText.replace(/\s+/g, ' ').trim());
    u.lang = lang === 'ar' ? 'ar-AE' : 'en-GB'; u.rate = .95;
    u.onend = () => this.setState({ speaking: false }); u.onerror = () => this.setState({ speaking: false });
    synth.speak(u); this.setState({ speaking: true });
  }
  renderVals() {
    const lang = this.state.lang ?? (typeof localStorage !== 'undefined' && localStorage.getItem('wyaana_lang')) ?? this.props.defaultLang ?? 'en';
    return { t: this.copy()[lang], dir: lang === 'ar' ? 'rtl' : 'ltr', toggleListen: () => window.WyaanaListen.open(lang, this.ref), listenLabel: this.state.speaking ? (lang === 'ar' ? 'إيقاف' : 'Stop') : (lang === 'ar' ? 'استمع' : 'Listen'), toggleLang: () => { const next = lang === 'ar' ? 'en' : 'ar'; try { localStorage.setItem('wyaana_lang', next); } catch (e) {} this.setState({ lang: next }); } };
  }
}
